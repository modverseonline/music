<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModVerse Music - Free Music Streaming</title>
  <meta name="description" content="Stream free music on ModVerse. Download latest songs, create playlists, and enjoy ad-free music experience."/>
  <meta name="keywords" content="free music, online songs, music streaming, mp3 download, ModVerse"/>
  <meta name="author" content="ModVerse"/>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  
  <style>
    /* Original Styles */
    :root {
      --primary: #6c5ce7;
      --secondary: #a8a5e6;
      --dark: #0a0a0a;
      --light: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: var(--dark);
      color: var(--light);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(0, 0, 0, 0.9);
      padding: 1rem;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px var(--primary), 0 0 10px var(--secondary); }
      to { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary); }
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background-color: #111;
      padding-top: 60px;
      transition: left 0.3s ease;
      z-index: 999;
    }

    .side-menu.open { left: 0; }

    .side-menu ul {
      list-style: none;
      padding: 0;
    }

    .side-menu li {
      padding: 15px 20px;
    }

    .side-menu li a {
      color: white;
      text-decoration: none;
      display: block;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* Music Page Styles */
    main {
      flex: 1;
      padding: 100px 20px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .music-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 2rem;
      margin: 1rem 0;
      backdrop-filter: blur(10px);
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .song-list {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
    }

    .song-item {
      padding: 1rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    button:hover { opacity: 0.9; }

    footer {
      text-align: center;
      padding: 1rem;
      background: #111;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <!-- Original Header/Navigation -->
  <header class="header">
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
    <div class="logo">ModVerse Music</div>
  </header>

  <nav id="sideMenu" class="side-menu">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="trending.html">Trending</a></li>
      <li><a href="genres.html">Genres</a></li>
      <li><a href="playlists.html">Playlists</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
    </ul>
  </nav>

  <canvas id="bgCanvas"></canvas>

  <!-- Music Content -->
  <main>
    <div class="music-card">
      <h1>Now Playing</h1>
      <audio id="mainPlayer" controls>
        <source src="music/sample.mp3" type="audio/mpeg">
        Your browser does not support audio
      </audio>
    </div>

    <div class="music-card">
      <h2>Popular Songs</h2>
      <div class="song-list">
        <div class="song-item">
          <span>Song Title 1 - Artist</span>
          <button onclick="playSong('https://youtu.be/fY8vm9dpU40')">Play</button>
        </div>
        <div class="song-item">
          <span>Song Title 2 - Artist</span>
          <button onclick="playSong('music/song2.mp3')">Play</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 ModVerse Music. All rights reserved.</p>
  </footer>

  <!-- Original Background Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Three.js Background
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bgCanvas'), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const geometry = new THREE.BufferGeometry();
    const vertices = new Float32Array(500 * 3);
    for(let i = 0; i < 500 * 3; i++) vertices[i] = (Math.random() - 0.5) * 10;
    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    
    const material = new THREE.PointsMaterial({ color: 0x6c5ce7, size: 0.05 });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);
    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      particles.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    // Menu Toggle
    function toggleMenu() {
      document.getElementById('sideMenu').classList.toggle('open');
    }

    // Music Player
    const player = document.getElementById('mainPlayer');
    function playSong(url) {
      player.src = url;
      player.play();
    }
  </script>
</body>
</html>
